workflows:
  harmix-android-build:
    name: Build Harmix Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      python: "3.11"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Setup Keystore
        script: |
          if [ -f harmix-debug.keystore.base64 ]; then
            base64 -d harmix-debug.keystore.base64 > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
