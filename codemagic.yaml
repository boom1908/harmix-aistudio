workflows:
  harmix-android-build:
    name: Build Harmix Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Setup Keystore
        script: |
          if [ -f harmix-debug.keystore.base64 ]; then
            base64 -D -i harmix-debug.keystore.base64 -o debug.keystore 2>/dev/null || base64 -d harmix-debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode harmix-debug.keystore.base64 > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -D -i debug.keystore.base64 -o debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi
      - name: Verify Python (Required for Chaquopy)
        script: |
          python3 --version
      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
