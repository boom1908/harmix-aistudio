name: Android CI & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (Required for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python & pip
        run: |
          python3 --version
          python3 -m pip --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore & Print Fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f harmix-debug.keystore.base64 ]; then
            echo "Restoring original debug.keystore from harmix-debug.keystore.base64..."
            base64 -d harmix-debug.keystore.base64 > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "================ APK SIGNING FINGERPRINTS ================"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "(SHA1|SHA256)"
          echo "=========================================================="

      - name: Verify google-services.json
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
              echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            else
              echo "::error file=app/google-services.json::app/google-services.json is missing! Because missingGoogleServicesStrategy=ERROR, Gradle will fail. Please commit app/google-services.json or add GOOGLE_SERVICES_JSON to GitHub Repository Secrets."
            fi
          else
            echo "app/google-services.json is present."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Package APK into ZIP for Fast Download
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-assets/harmix-debug.apk
            cd release-assets
            zip -9 harmix-debug.zip harmix-debug.apk
            cd ..
            ls -lh release-assets
          else
            echo "Error: No APK file found!"
            exit 1
          fi

      - name: Publish to GitHub Releases (APK & ZIP)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Harmix Build v0.1.${{ github.run_number }}
          body: |
            ### Harmix Build #${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            #### Downloads:
            - **harmix-debug.zip** — Compressed ZIP containing the APK (fast download)
            - **harmix-debug.apk** — Direct APK installer
          files: |
            release-assets/harmix-debug.zip
            release-assets/harmix-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APK Artifact (Optional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: harmix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: warn
